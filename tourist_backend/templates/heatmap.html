<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alerts Heatmap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 600px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Tourist Safety Dashboard</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Tourists</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard/alerts">Alerts</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/dashboard/heatmap">Heatmap</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Alert Locations</h2>
        <div id="map"></div>
    </div>

    <script>
        // Initialize the map (centered on India)
        const map = L.map('map').setView([20.5937, 78.9629], 5);

        // Add a tile layer from OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Fetch alert data from our API and add markers
        fetch('/alerts')
            .then(response => response.json())
            .then(alerts => {
                alerts.forEach(alert => {
                    L.marker([alert.latitude, alert.longitude])
                     .addTo(map)
                     .bindPopup(`<b>Alert from Tourist ID: ${alert.tourist_id}</b><br>Time: ${new Date(alert.timestamp).toLocaleString()}`);
                });
            })
            .catch(error => console.error('Error fetching alerts:', error));
    </script>
</body>
</html>
