<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authority Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Tourist Safety Dashboard</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="/">Tourists</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard/alerts">Alerts</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard/heatmap">Heatmap</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Registered Tourists</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Passport No.</th>
                    <th>Blockchain Certificate Hash</th>
                </tr>
            </thead>
            <tbody>
                {% for tourist in tourists %}
                <tr>
                    <td>{{ tourist.id }}</td>
                    <td>{{ tourist.name }}</td>
                    <td>{{ tourist.email }}</td>
                    <td>{{ tourist.passport_no }}</td>
                    <td><small><code>{{ tourist.blockchain_hash }}</code></small></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
